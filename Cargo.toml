[package]
name = "atomic_solver"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
atomic-movegen = "2.2"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"

[dev-dependencies]
serde_json = "=1.0.120"
# proofdb tooling (examples only): SQLite writer for the global proof store
# (bundled: no system libsqlite3 in this container) and manifest digesting.
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
